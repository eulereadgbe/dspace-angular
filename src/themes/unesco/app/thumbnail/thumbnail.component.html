<div class="thumbnail" [class.limit-width]="limitWidth" *ngVar="(isLoading$ | async) as isLoading">
  <div *ngIf="isLoading" class="thumbnail-content outer">
    <div class="inner">
      <div class="centered">
        <ds-loading [spinner]="true"></ds-loading>
      </div>
    </div>
  </div>
  <ng-container *ngVar="(src$ | async) as src">
    <!-- don't use *ngIf="!isLoading" so the thumbnail can load in while the animation is playing -->
    <img *ngIf="src !== null" class="thumbnail-content img-fluid" [ngClass]="{'d-none': isLoading}"
         [src]="src | dsSafeUrl" [alt]="alt | translate" (error)="errorHandler()" (load)="successHandler()">
    <ng-container *ngIf="src === null && !isLoading">
      <!-- No thumbnail: generated cover image built from the item's metadata -->
      <img *ngIf="coverSrc; else blank" class="thumbnail-content img-fluid generated-cover"
           [src]="coverSrc | dsSafeUrl" [alt]="coverAlt">
      <ng-template #blank>
        <div class="thumbnail-content outer">
          <div class="inner">
            <img src="assets/unesco/images/blank.jpg" alt="" class="thumbnail-content img-fluid centered">
          </div>
        </div>
      </ng-template>
    </ng-container>
  </ng-container>
</div>
